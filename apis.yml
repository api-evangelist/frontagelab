aid: frontagelab
name: Frontage Laboratories
description: Frontage Laboratories is a global contract research organization (CRO)
  providing integrated, science-driven drug discovery and development services across
  the pharmaceutical and biotechnology lifecycle. Its services span drug discovery
  (chemistry, biology, ADME/toxicology screening, pharmacology), drug development
  (DMPK, preclinical safety and toxicology, clinical trial support), laboratory testing
  (bioanalysis, genomics, central lab, biomarkers), CMC (product development, formulation,
  analytical services, manufacturing), and agrochemical support. Frontage operates
  roughly 28 sites across North America, Asia-Pacific, and Europe with about 2,200
  employees. It was surfaced as a portfolio company of Qiming Venture Partners and
  added to the API Evangelist network. Frontage publishes no public developer portal,
  API, SDK, or programmatic integration surface, so this profile captures company
  identity and web properties only.
